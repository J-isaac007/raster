# Builds the Windows installer when a version tag (v1.2.3) is pushed and
# publishes it as a GitHub Release, with that version's CHANGELOG notes.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Check the tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version" \
            || { echo "Tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the installer
        run: npm run dist

      - name: Extract release notes
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\n---\n**Download** `Raster-Setup-%s.exe` below to install, or `Raster-%s-portable.exe` to run without installing. [How to install](https://github.com/%s/blob/main/docs/install.md) · [Privacy](https://github.com/%s/blob/main/docs/privacy.md)\n' \
            "$VERSION" "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # latest.yml and the blockmap are what installed copies read to
          # find, verify and download updates.
          gh release create "$GITHUB_REF_NAME" \
            "release/Raster-Setup-$VERSION.exe" \
            "release/Raster-Setup-$VERSION.exe.blockmap" \
            "release/latest.yml" \
            "release/Raster-$VERSION-portable.exe" \
            --title "Raster $VERSION" --notes-file notes.md
