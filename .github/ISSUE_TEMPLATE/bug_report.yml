name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    attributes:
      label: Windows and Raster version
      placeholder: Windows 11, Raster 0.2.0 (Help › About)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything else?
      description: Screenshots, or a .raster file that shows the problem.
